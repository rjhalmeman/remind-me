<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Eventos</title>
    <link rel="stylesheet" href="../global.css">
</head>
<body>
    <div class="container">
        <h1>Eventos</h1>
        <a href="../menu/menu.html">Voltar</a>
        <hr>
        
        <form onsubmit="salvar(event)">
            <label>Nome:</label> <input type="text" id="nome" required>
            <label>Data:</label> <input type="date" id="data" required>
            <label>Hora:</label> <input type="time" id="hora" required>
            <label>Descrição:</label> <input type="text" id="desc">
            <label>Responsável (ID):</label> <input type="number" id="id_pessoa" required>
            
            <label>Status:</label>
            <select id="status">
                <option value="1">Agendado</option>
                <option value="2">Em andamento</option>
                <option value="3">Cancelado</option>
                <option value="4">Concluído</option>
            </select>

            <button type="submit">Salvar Novo</button>
        </form>

        <hr>
        <h3>Todos os Eventos</h3>
        <ul id="lista"></ul>
    </div>
    <script src="eventos.js"></script>
</body>
</html>
