<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Status</title>
    <link rel="stylesheet" href="../global.css">
</head>
<body>
    <div class="container">
        <h1>Tipos de Status</h1>
        <a href="../menu/menu.html">Voltar</a>
        <ul id="lista"></ul>
    </div>
    <script>
        window.onload = function() {
            fetch('/api/status').then(function(r){ return r.json() })
            .then(function(d){
                var ul = document.getElementById('lista');
                for(var i=0; i<d.length; i++) {
                    ul.innerHTML += '<li>ID: ' + d[i].id_status + ' - ' + d[i].descricao_status + '</li>';
                }
            });
        };
    </script>
</body>
</html>
