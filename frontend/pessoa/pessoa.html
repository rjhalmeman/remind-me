<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Pessoas</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="./pessoa.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gerenciamento de Pessoas</h1>
            <a href="../menu/menu.html">Voltar ao Menu</a>
        </header>
        <hr>

        <main>
            <section class="form-section">
                <h2>Cadastro de Pessoa</h2>

                <form id="pessoaForm">
                    <div class="search-container">
                        <label for="searchId">Buscar por ID:</label>
                        <div class="search-input-group">
                            <input type="number" id="searchId" placeholder="ID">
                            <button type="button" id="btnBuscar">🔍 Buscar</button>

                            <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>
                            <button type="button" id="btnAlterar" class="btn-secondary" style="display: none;">Alterar</button>
                            <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
                            <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
                            <button type="button" id="btnCancelar" class="btn-cancel" style="display: none;">Cancelar</button>
                        </div>
                    </div>

                    <fieldset id="formFields" style="border: none; padding: 0;">
                        <div class="form-group">
                            <label for="nome_pessoa">Nome:</label>
                            <input type="text" id="nome_pessoa" required disabled>
                        </div>
                        <div class="form-group">
                            <label for="email_pessoa">Email:</label>
                            <input type="email" id="email_pessoa" required disabled>
                        </div>
                        <div class="form-group">
                            <label for="senha_pessoa">Senha:</label>
                            <input type="password" id="senha_pessoa" required disabled>
                        </div>
                        <div class="form-group">
                            <label for="data_nascimento_pessoa">Data de Nascimento:</label>
                            <input type="date" id="data_nascimento_pessoa" disabled>
                        </div>

                        <div class="foto-panel">
                            <label>Foto do Perfil (100x150)</label>
                            
                            <img id="imgPreview" class="foto-preview" src="" alt="Sem Foto">
                            
                            <div class="foto-controls">
                                <input type="file" id="inputArquivo" accept="image/*" disabled>
                                
                                <button type="button" id="btnColar" class="btn-secondary" disabled onclick="colarImagem()">📋 Colar da Área de Transf.</button>
                                
                                <button type="button" onclick="limparFoto()" id="btnLimparFoto" class="btn-danger" style="font-size: 10px; padding: 2px;" disabled>Remover Foto</button>
                            </div>
                        </div>

                    </fieldset>
                </form>
            </section>

            <section class="list-section">
                <h3>Pessoas Cadastradas</h3>
                <div class="table-container">
                    <table id="pessoasTable">
                        <thead>
                            <tr>
                                <th style="width: 50px;">ID</th>
                                <th style="width: 60px;">Foto</th>
                                <th>Nome</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody id="pessoasTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
        <div id="messageContainer" class="message-container"></div>
    </div>
    <script src="./pessoa.js" defer></script>
</body>
</html>
